<title>Romy's Projects Hub</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f0d24"><meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Press+Start+2P&display=swap">
<style>
/* Palette « crépuscule » : indigo profond + violet, corail, or, menthe. Un thème clair lavande suit l'appareil. */
:root{
  --bg:#0f0d24;--bg2:#171436;--panel:rgba(26,21,62,.86);--solid:#1b1740;--solid2:#241f55;--line:#3d3490;
  --fg:#f4f1ff;--muted:#aaa4d8;--violet:#8b6bff;--coral:#ff7a9c;--gold:#ffc857;--mint:#46e6a8;--warn:#ffb454;--bad:#ff6b81;
  --ext:#ff9f43;--shadow:rgba(0,0,0,.4);--head:'Press Start 2P',monospace;--body:'Nunito',system-ui,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f6f2ff;--bg2:#ece6ff;--panel:rgba(255,255,255,.9);--solid:#fff;--solid2:#f0eaff;--line:#cfc3f5;
  --fg:#241b52;--muted:#6a6196;--violet:#6a45f0;--coral:#e8456e;--gold:#c98400;--mint:#0f9f72;--warn:#b86a00;--bad:#d4324e;--ext:#d9741a;--shadow:rgba(60,40,140,.22);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f6f2ff;--bg2:#ece6ff;--panel:rgba(255,255,255,.9);--solid:#fff;--solid2:#f0eaff;--line:#cfc3f5;
  --fg:#241b52;--muted:#6a6196;--violet:#6a45f0;--coral:#e8456e;--gold:#c98400;--mint:#0f9f72;--warn:#b86a00;--bad:#d4324e;--ext:#d9741a;--shadow:rgba(60,40,140,.22);color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:700 14px/1.45 var(--body);overflow:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
.ic{width:18px;height:18px;flex:none}
#app{height:100dvh;display:flex;flex-direction:column}
/* barre du haut */
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-top:max(8px,env(safe-area-inset-top,0px));background:var(--solid);border-bottom:2px solid var(--line);position:relative;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:0}
.brand svg{width:38px;height:38px;display:block;filter:drop-shadow(0 2px 0 var(--shadow))}
.bt{display:grid;text-align:left;line-height:1.25}
.bt b{font:400 10px/1.4 var(--head);color:var(--gold)}.bt i{font:400 8px/1.4 var(--head);font-style:normal;color:var(--fg)}
.tabs{display:flex;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-left:6px}
.tabs button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:800;display:flex;gap:6px;align-items:center}
.tabs button[aria-pressed="true"]{background:var(--violet);color:#fff}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--bg2);border-radius:11px;padding:7px 11px;cursor:pointer;font-weight:800;transition:transform .08s,border-color .15s}
.tb:hover{border-color:var(--violet)}.tb:active{transform:translateY(2px)}
.tb.primary{background:linear-gradient(135deg,var(--violet),var(--coral));border-color:transparent;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.tb.ico{padding:7px 9px}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(max-width:760px){.bt{display:none}.tb span{display:none}.tb{padding:7px 9px;flex:none}.tabs{margin-left:0}.tools{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tb .badge2{display:inline}}
/* village */
#vv{position:relative;flex:1;min-height:0;overflow:hidden}
#stage{position:absolute;inset:0;overflow:auto;background:#1d5a49}
#cv{display:block;image-rendering:pixelated;cursor:default}
#plates{position:absolute;left:0;top:0}
.plate{position:relative;display:grid;gap:4px;justify-items:center;background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:2px solid var(--c);border-radius:12px;padding:5px 10px 6px;color:var(--fg);cursor:pointer;box-shadow:0 3px 0 var(--shadow),0 0 22px color-mix(in srgb,var(--c) 45%,transparent);white-space:nowrap}
.plate:hover,.plate.sel{border-color:var(--gold);z-index:3}
.plate.sel{box-shadow:0 3px 0 var(--shadow),0 0 26px var(--gold)}
.plate::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--solid);border:2px solid var(--c);border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg);border-radius:0 0 3px 0}
@keyframes drop{from{opacity:0;transform:translate(-50%,-180%) scale(.8)}to{opacity:1;transform:translate(-50%,-100%)}}
.plate .row{display:flex;align-items:center;gap:7px}
.plate .nm{font-weight:800;font-size:13px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.plate .lv{font:400 8px/1 var(--head);background:var(--gold);color:#2a1d00;border-radius:6px;padding:4px 5px}
.plate .xp{display:block;width:100%;height:5px;background:color-mix(in srgb,var(--fg) 18%,transparent);border-radius:3px;overflow:hidden}
.plate .xp b{display:block;height:100%;background:var(--c);border-radius:3px}
.plate .pend{font:400 7px/1.4 var(--head);color:var(--warn)}
.st{width:9px;height:9px;border-radius:50%;flex:none}
.s-active{background:var(--mint);box-shadow:0 0 8px var(--mint)}.s-recent{background:var(--warn)}.s-dormant,.s-paused{background:#8d8ab8}.s-pending{background:var(--violet)}
.emb{display:block;flex:none;border-radius:5px}
#tip{position:absolute;pointer-events:none;background:var(--solid);color:var(--fg);border:2px solid var(--line);padding:6px 10px;border-radius:10px;font-size:12px;max-width:260px;z-index:6;display:none;box-shadow:0 3px 0 var(--shadow)}
#tip small{color:var(--muted);display:block}
/* HUD */
#hud{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none;z-index:5}
.chip{pointer-events:auto;display:flex;align-items:center;gap:9px;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid var(--line);border-radius:14px;padding:6px 12px 6px 8px;box-shadow:0 3px 0 var(--shadow)}
.chip .bub{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 22%,transparent);color:var(--a)}
.chip b{font:800 20px/1 var(--body);display:block;font-variant-numeric:tabular-nums}
.chip small{display:block;color:var(--muted);font-size:11px;font-weight:700;line-height:1.2}
.chip .tr{font-size:11px;font-weight:800;margin-left:2px}.up{color:var(--mint)}.down{color:var(--coral)}
#helpfab{position:absolute;left:12px;bottom:12px;z-index:5;display:flex;gap:8px;align-items:center}
@media(max-width:600px){.chip small{display:none}.chip{padding:5px 10px 5px 6px;flex:none}#hud{flex-wrap:nowrap;overflow-x:auto;pointer-events:auto;scrollbar-width:none}}
/* tiroir */
#drawer{position:absolute;right:0;top:0;bottom:0;width:min(410px,100%);background:var(--solid);border-left:2px solid var(--line);z-index:8;overflow:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;box-shadow:-8px 0 30px var(--shadow);animation:slide .25s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
@media(max-width:720px){#drawer{top:auto;height:68%;border-left:0;border-top:2px solid var(--line);border-radius:18px 18px 0 0;animation:up .25s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}}
.dh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dt{display:flex;gap:12px;align-items:center;min-width:0}
.dt .emb{width:46px;height:46px;border-radius:10px}
.dt h2{margin:0;font:800 19px/1.2 var(--body)}.dt p{margin:2px 0 0;color:var(--muted);font-size:13px}
.x{border:2px solid var(--line);background:var(--bg2);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--pc,var(--muted)) 20%,transparent);color:var(--pc,var(--muted))}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.tile b{display:block;font:800 18px/1.2 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font-size:11.5px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;border:2px solid var(--line);background:var(--bg2)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;gap:7px;align-items:center;text-decoration:none;font-weight:800;padding:8px 13px;border-radius:11px;border:2px solid var(--line);background:var(--bg2);cursor:pointer;transition:transform .08s}
.btn:hover{border-color:var(--c,var(--violet))}.btn:active{transform:translateY(2px)}
.btn.main{background:linear-gradient(135deg,var(--c,var(--violet)),var(--coral));border-color:transparent;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.28)}
h3{margin:0;font:800 13px/1.3 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin:0;padding:0;list-style:none}
.list li>*{display:flex;gap:9px;align-items:center;width:100%;text-align:left;text-decoration:none;background:var(--bg2);border:2px solid transparent;border-radius:10px;padding:7px 10px;cursor:pointer}
.list li>*:hover{border-color:var(--c,var(--violet))}
.list .t{min-width:0;flex:1}.list .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.list .t small{color:var(--muted);font-size:11.5px;font-weight:600}
textarea,input[type=text].fi,select.fi{width:100%;font:inherit;font-size:14px;padding:9px 11px;border-radius:10px;border:2px solid var(--line);background:var(--bg2);color:var(--fg);resize:vertical}
.spark svg{width:100%;height:56px;display:block}
.hint{color:var(--muted);font-size:12.5px;font-weight:600;margin:0}
/* stats */
#sv{flex:1;min-height:0;overflow:auto;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{position:relative;overflow:hidden;background:var(--solid);border:2px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 4px 0 var(--shadow)}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--a)}
.kpi .bub{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 22%,transparent);color:var(--a);margin-bottom:8px}
.kpi b{font:800 30px/1 var(--body);font-variant-numeric:tabular-nums;display:block}
.kpi small{color:var(--muted);font-weight:700}.kpi .tr{font-size:12px;font-weight:800;margin-left:6px}
.kpi svg.sp{position:absolute;right:10px;bottom:8px;width:84px;height:30px;opacity:.9}
.panel{background:var(--solid);border:2px solid var(--line);border-radius:16px;padding:16px;min-width:0;box-shadow:0 4px 0 var(--shadow)}
.panel h2{margin:0 0 10px;font:800 16px var(--body)}
.g2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
@media(max-width:860px){.g2{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(80px,150px) 1fr 34px;gap:8px;align-items:center;font-size:12.5px}
.bar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .tr{height:10px;background:var(--bg2);border-radius:6px;overflow:hidden}.bar .tr b{display:block;height:100%;border-radius:6px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.langs{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:6px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:16px}
.pc{background:var(--solid);border:2px solid var(--line);border-top:5px solid var(--c);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0;box-shadow:0 4px 0 var(--shadow)}
.pc header{display:flex;gap:12px;align-items:center;justify-content:space-between}
.pc h2{margin:0;font:800 18px var(--body)}.pc header .emb{width:42px;height:42px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12.5px}th{font-weight:700;color:var(--muted);text-align:left;font-size:11.5px}
td,th{padding:5px 10px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}td.n{white-space:nowrap;font-variant-numeric:tabular-nums}td.m{color:var(--muted);min-width:160px}
.ok{color:var(--mint)}.ko{color:var(--bad)}
/* fenêtres, tuto */
#layer{position:fixed;inset:0;pointer-events:none;z-index:50}
.modal{position:fixed;inset:0;pointer-events:auto;background:rgba(8,6,26,.62);backdrop-filter:blur(3px);display:grid;place-items:center;padding:14px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(640px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:var(--solid);border:2px solid var(--line);border-radius:18px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;box-shadow:0 8px 0 var(--shadow);animation:pop .25s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.sheet h2{margin:0;font:800 20px var(--body)}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.legrow{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.legrow canvas{width:64px;height:64px;image-rendering:pixelated;background:linear-gradient(#8fd3ff 60%,#5dc25a 60%);border-radius:10px;border:2px solid var(--line)}
.legrow .ico{width:64px;height:64px;border-radius:10px;border:2px solid var(--line);background:var(--bg2);display:grid;place-items:center;font-size:28px}
.legrow b{display:block}.legrow span{color:var(--muted);font-weight:600;font-size:13px}
.sr{display:grid;gap:4px;max-height:50vh;overflow:auto}
.sr button{display:flex;gap:10px;align-items:center;border:2px solid transparent;background:var(--bg2);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left}
.sr button.on,.sr button:hover{border-color:var(--violet)}.sr small{color:var(--muted);margin-left:auto;font-weight:600}
.field{display:grid;gap:5px}.field label{font-size:12.5px;color:var(--muted);font-weight:800}
.row2{display:grid;grid-template-columns:90px 1fr;gap:10px}
.sw{display:flex;gap:7px;flex-wrap:wrap}.sw button{width:28px;height:28px;border-radius:9px;border:3px solid transparent;cursor:pointer}.sw button[aria-pressed="true"]{border-color:var(--fg)}
.steps{display:grid;gap:8px;counter-reset:s;margin:0;padding:0}.steps li{list-style:none;display:flex;gap:10px;align-items:center;background:var(--bg2);border-radius:12px;padding:8px 10px;counter-increment:s}
.steps li::before{content:counter(s);font:400 10px var(--head);background:var(--gold);color:#2a1d00;border-radius:8px;min-width:26px;height:26px;display:grid;place-items:center}
.steps li span{flex:1}
.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);border:2px solid var(--warn);border-radius:12px;padding:8px 10px;font-size:13px}
pre.json{margin:0;max-height:150px;overflow:auto;background:var(--bg2);border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,monospace;color:var(--muted)}
.spot{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(8,6,26,.72),0 0 0 3px var(--gold);pointer-events:none;transition:all .3s;z-index:60}
.tdim{position:fixed;inset:0;background:rgba(8,6,26,.72);pointer-events:auto;z-index:59}
.tcard{position:fixed;z-index:61;width:min(340px,calc(100vw - 24px));background:var(--solid);border:2px solid var(--gold);border-radius:16px;padding:14px 16px;pointer-events:auto;box-shadow:0 6px 0 var(--shadow);display:grid;grid-template-columns:minmax(0,1fr);gap:8px;animation:pop .25s}
.tcard h3{color:var(--gold);font:400 10px/1.5 var(--head);text-transform:none;letter-spacing:0}
.tcard p{margin:0;font-size:14px;font-weight:600}
.tnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.dots{display:flex;gap:4px;flex:1 1 100%;margin-bottom:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold)}

.plw{position:absolute;transform:translate(-50%,-100%);animation:drop .5s cubic-bezier(.2,.9,.3,1.3) both}
.plmini{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:38px;min-height:38px;padding:4px 0;border-radius:12px;border:2px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--fg);cursor:pointer;box-shadow:0 3px 0 var(--shadow);text-decoration:none;font:800 12px var(--body)}
.plreq{right:100%;margin-right:8px;color:var(--coral);border-color:var(--coral)}
.plchat{left:100%;margin-left:8px;color:var(--violet);border-color:var(--violet)}
.plmini:hover{background:var(--solid2);transform:translateY(-50%) scale(1.07)}
.plmini b{font-size:12px;line-height:1;color:var(--fg)}
.xt{font-size:11px;font-weight:800;color:var(--ext)}
.per{display:flex;align-items:center;gap:3px;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:3px;margin-left:6px}
.per .pl{font-size:11px;color:var(--muted);padding:0 6px;font-weight:800}
.per button{border:0;background:none;color:var(--muted);padding:5px 10px;border-radius:9px;cursor:pointer;font-weight:800}
.per button[aria-pressed="true"]{background:var(--gold);color:#2a1d00}
@media(max-width:760px){.per .pl{display:none}.per button{padding:5px 7px}.per{margin-left:0}}
.badge2{font-style:normal;background:var(--coral);color:#fff;border-radius:99px;padding:1px 7px;font-size:11px;font-weight:800}
button.chip{font:inherit;color:inherit;cursor:pointer;text-align:left}button.chip:hover{border-color:var(--a)}
.dbtn{display:flex;gap:6px}
.btn.big{display:flex;width:100%;padding:12px 14px;gap:12px;justify-content:flex-start}
.btn.big span{display:grid;text-align:left;min-width:0}.btn.big b{font-size:15px}.btn.big small{font-weight:600;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mainc{display:grid;gap:8px}
.list li.two{display:flex;gap:6px;align-items:stretch}
.list li.two>*{width:auto}
.list li.two>a,.list li.two>.who,.list li.two>button:first-child{flex:1;min-width:0}
.list li>.mini{width:auto;flex:none;align-self:center;font-size:12px;padding:5px 10px;border:2px solid var(--line);background:var(--bg2)}
.list li>.who{cursor:default}
.mini{border:2px solid var(--line);background:var(--bg2);border-radius:9px;font-weight:800;font-size:12px;padding:5px 10px;cursor:pointer;color:var(--fg)}.mini:hover{border-color:var(--violet)}
.av{position:relative;width:30px;height:30px;border-radius:50%;flex:none;background:var(--solid2);display:grid;place-items:center;overflow:hidden;border:2px solid var(--line)}
.av i{font:400 9px var(--head);font-style:normal;color:var(--muted)}
.av::before{content:"";position:absolute;inset:0;background:var(--bg) center/cover no-repeat;background-image:var(--bg)}
.kind{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;flex:none;background:color-mix(in srgb,var(--kc) 20%,transparent);color:var(--kc)}
.k-me{--kc:var(--violet)}.k-team{--kc:var(--mint)}.k-ext{--kc:var(--ext)}.k-ia{--kc:#8d8ab8}
.extmsg{color:var(--ext)!important;font-weight:800}
.warnt{color:var(--coral)}
.seg{display:inline-flex;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:3px;gap:3px;justify-self:start}
.seg button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:800}.seg button[aria-pressed="true"]{background:var(--violet);color:#fff}
.chips2{display:flex;flex-wrap:wrap;gap:6px}.chips2 button{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--line);background:var(--bg2);border-radius:99px;padding:4px 10px;cursor:pointer;font-weight:800;font-size:12.5px}.chips2 button[aria-pressed="true"]{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 22%,transparent)}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.logos button{display:grid;justify-items:center;gap:3px;border:2px solid var(--line);background:var(--bg2);border-radius:12px;padding:6px 2px;cursor:pointer;font-size:11px;font-weight:800;color:var(--muted)}.logos button[aria-pressed="true"]{border-color:var(--gold);color:var(--fg)}
.rchips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.rchip{display:inline-flex;align-items:center;gap:2px;background:color-mix(in srgb,var(--violet) 20%,transparent);border-radius:99px;padding:3px 4px 3px 10px;font-size:12.5px;font-weight:600}.rchip b{font-weight:800}.rchip button{border:0;background:none;color:inherit;cursor:pointer;font-size:16px;line-height:1;padding:0 6px;border-radius:50%}
.rplist{display:grid;gap:4px;max-height:220px;overflow:auto}
.rp{display:flex;gap:10px;align-items:center;border:2px solid transparent;background:var(--bg2);border-radius:10px;padding:6px 10px;cursor:pointer;text-align:left}.rp:hover{border-color:var(--violet)}.rp.on{border-color:var(--mint)}.rp[disabled]{opacity:.5;cursor:not-allowed}
.rp .rpm{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--solid2);font-weight:800;flex:none}.rp.on .rpm{background:var(--mint);color:#06281c}
.rp .t{min-width:0;flex:1}.rp .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.rp small{color:var(--muted);font-size:11.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar2{display:grid;grid-template-columns:minmax(90px,150px) 1fr 38px;gap:8px;align-items:center;font-size:12.5px}.bar2 .n{display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap}.tr2{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bg2)}.tr2 b{display:block;height:100%}.bar2 .v{text-align:right;color:var(--muted)}
.bars2{display:grid;gap:8px}
.mbx{position:absolute;transform:translate(-50%,0);background:transparent;border:2px solid transparent;border-radius:10px;cursor:pointer;padding:0;z-index:2}
.mbx:hover,.mbx:focus-visible{background:color-mix(in srgb,var(--coral) 18%,transparent);border-color:var(--coral)}
.mbx b{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;border-radius:99px;font:800 11px/1.3 var(--body);padding:1px 7px;box-shadow:0 2px 0 var(--shadow);white-space:nowrap}
.mb{display:grid;gap:8px;border:2px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:10px 12px;background:color-mix(in srgb,var(--c) 6%,transparent)}
.mbh{display:flex;gap:10px;align-items:center}.mbh b{font:800 15px var(--body);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbn{font:800 12px var(--body);background:var(--coral);color:#fff;border-radius:99px;padding:1px 9px}
@media(max-width:1000px){#hud{flex-wrap:nowrap;overflow-x:auto;pointer-events:auto;scrollbar-width:none}.chip{flex:none}}
#tip b{display:block;margin-bottom:2px}
.ut{font-size:11px;font-weight:800;color:var(--uc)}
.dl{font-size:11px;font-weight:800;color:var(--gold)}.dl.hot{color:var(--bad)}
.plate .nw{position:absolute;top:-9px;right:-8px;font:400 7px/1 var(--head);background:var(--coral);color:#fff;border-radius:6px;padding:3px 4px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.hl{display:flex;gap:14px;align-items:center}.hlist{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:12.5px;min-width:0}.hlist small{color:var(--muted);font-weight:600}.hlist .ok{color:var(--mint)}.hlist .ko{color:var(--bad)}
label.todo{display:flex;gap:10px;align-items:center;cursor:pointer}.todo.done .t b{text-decoration:line-through;color:var(--muted)}.todo input{width:18px;height:18px;accent-color:var(--violet);flex:none}
.row3{display:grid;grid-template-columns:160px 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:45;width:min(420px,calc(100vw - 24px));background:var(--solid);border:2px solid var(--gold);border-radius:14px;padding:12px 14px;box-shadow:0 6px 0 var(--shadow);animation:pop .3s;font-size:13px}
.toast ul{margin:6px 0;padding:0;list-style:none;display:grid;gap:3px}.toast .dotc{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}.toast small{color:var(--muted)}
#fx{position:absolute;left:0;top:0;pointer-events:none;z-index:4;width:100%;height:100%}
.say{position:absolute;transform:translateX(-50%);background:var(--solid);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:5px 10px;font-weight:800;font-size:13px;white-space:nowrap;box-shadow:0 3px 0 var(--shadow);animation:pop .2s}
.say.big{border-color:var(--gold);color:var(--gold)}
#walkhint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:6;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:12.5px;font-weight:700;max-width:calc(100% - 24px);text-align:center}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font:700 11px var(--body);background:var(--bg2)}
#walkprompt{position:absolute;transform:translate(-50%,-100%);z-index:7;border:2px solid var(--gold);background:var(--solid);color:var(--fg);border-radius:10px;padding:5px 10px;font:800 13px var(--body);cursor:pointer;box-shadow:0 3px 0 var(--shadow);white-space:nowrap}
#vv.walking #stage{cursor:crosshair}
.eggi{font-size:22px;width:34px;text-align:center;flex:none}
code{font:12px ui-monospace,monospace;background:var(--bg2);border-radius:5px;padding:1px 5px}
.chk2{display:flex;gap:8px;align-items:center;font-size:13.5px}.chk2 input{width:18px;height:18px;accent-color:var(--violet)}
#stage{scrollbar-width:thin}
.navb{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:44px;height:64px;border-radius:14px;border:2px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);color:var(--fg);font:800 30px/1 var(--body);cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.navb:hover{border-color:var(--gold)}#navL{left:8px}#navR{right:8px}
#vdots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:9px;z-index:6;background:var(--panel);border:2px solid var(--line);border-radius:99px;padding:6px 10px}
#vdots:empty{display:none}
.vd{width:13px;height:13px;border-radius:50%;border:2px solid #fff;background:var(--c);opacity:.55;cursor:pointer;padding:0}.vd.on{opacity:1;transform:scale(1.25)}
@media(max-width:600px){.navb{width:34px;height:52px}}
.tile{border-top:3px solid var(--tc,var(--violet))}
.tiles .tile:nth-child(5n+1){--tc:var(--violet)}.tiles .tile:nth-child(5n+2){--tc:var(--mint)}.tiles .tile:nth-child(5n+3){--tc:var(--gold)}.tiles .tile:nth-child(5n+4){--tc:var(--coral)}.tiles .tile:nth-child(5n){--tc:#4aa8ff}
.kpis .kpi:nth-child(7n+4)::before{background:var(--coral)}.kpis .kpi:nth-child(7n+6)::before{background:#4aa8ff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
