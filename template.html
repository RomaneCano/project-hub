<title>Project Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Press+Start+2P&display=swap">
<style>
/* Disposition : bandeau de synthèse, graphique d'activité global, puis une carte détaillée par projet. */
:root{
  --bg:#f4f6f8; --surface:#fff; --surface2:#eef1f5; --line:#dde2e9;
  --fg:#16202c; --muted:#5d6b7b; --accent:#2f6df6;
  --ok:#16a34a; --warn:#d97706; --off:#8b97a6; --bad:#dc2626;
  --head:'Space Grotesk','Inter',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#16202b; --surface2:#1d2a37; --line:#273544;
  --fg:#e6edf5; --muted:#94a3b5; --accent:#6b9bff; --ok:#4ade80; --warn:#fbbf24; --off:#6b7a8c; --bad:#f87171; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#16202b; --surface2:#1d2a37; --line:#273544;
  --fg:#e6edf5; --muted:#94a3b5; --accent:#6b9bff; --ok:#4ade80; --warn:#fbbf24; --off:#6b7a8c; --bad:#f87171; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance}
a{color:inherit}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.top h1{font-size:30px;letter-spacing:-.02em}
.top p{margin:2px 0 0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile b{display:block;font:700 28px/1.1 var(--head);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font-size:15px;margin-bottom:10px}
.row2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
@media(max-width:820px){.row2{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i,.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;max-height:230px;overflow:auto}
.feed li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;font-size:13px}
.feed small{color:var(--muted);grid-column:2}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 12px;border-radius:99px;font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card header{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.card h2{font-size:20px;letter-spacing:-.01em}
.card header p{margin:2px 0 0;color:var(--muted)}
.pill{flex:none;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid currentColor}
.s-active{color:var(--ok)}.s-recent{color:var(--warn)}.s-dormant{color:var(--off)}.s-paused{color:var(--off)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.metrics div{background:var(--surface2);border-radius:8px;padding:8px 10px}
.metrics b{display:block;font:700 18px/1.2 var(--head);font-variant-numeric:tabular-nums}
.metrics span{font-size:12px;color:var(--muted)}
.spark{display:flex;align-items:end;gap:10px}
.spark svg{flex:1;min-width:0;height:54px}
.spark small{color:var(--muted);font-size:12px;white-space:nowrap}
.links{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-weight:500;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
.btn:hover{border-color:var(--c)}
.btn.main{background:var(--c);color:#fff;border-color:var(--c)}
.next{background:var(--surface2);border-left:3px solid var(--c);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px}
.next em{color:var(--muted);font-style:normal}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:13px;list-style-position:inside}
.tbl{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--muted);text-align:left;font-size:12px}
td,th{padding:5px 10px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
td.m{color:var(--muted);min-width:180px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px}
.ci-success{color:var(--ok)}.ci-failure{color:var(--bad)}.ci-none{color:var(--off)}
.conv{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.conv a{text-decoration:none;display:block;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.conv a:hover{border-color:var(--c)}.conv small{color:var(--muted);display:block}
.err{color:var(--bad);font-size:12px}
.foot{color:var(--muted);font-size:12px}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}

.tabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tabs button{border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:8px 16px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.vil{display:flex;flex-direction:column;gap:12px}
.stage{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;text-align:center}
.stage canvas{image-rendering:pixelated;display:inline-block;max-width:none;vertical-align:top}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);padding:5px 9px;border-radius:6px;font-size:12px;max-width:260px;z-index:5;text-align:left;display:none}
.vlegend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:12.5px}
.info{border-top:4px solid var(--c)}
.info h3{font-size:18px;margin-bottom:4px}.info p{margin:0 0 8px;color:var(--muted)}
</style>
<div class="wrap" id="app"></div>
<script>
const D = /*__DATA__*/null;
const $ = (s, e = document) => e.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rel = iso => {
  if (!iso) return "—";
  const d = (Date.now() - new Date(iso)) / 864e5;
  if (d < 1 / 24) return "il y a moins d'1 h";
  if (d < 1) return `il y a ${Math.floor(d * 24)} h`;
  if (d < 2) return "hier";
  if (d < 30) return `il y a ${Math.floor(d)} j`;
  if (d < 365) return `il y a ${Math.floor(d / 30)} mois`;
  return `il y a ${Math.floor(d / 365)} an(s)`;
};
const fdate = iso => iso ? new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }) : "—";
const STATUS = { active: "Actif", recent: "Récent", dormant: "Endormi", paused: "En pause" };
const MAXW = D.weeks;

function bars(series, color, h = 54) {
  const w = 240, n = series.length, bw = w / n, max = Math.max(1, ...series);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Commits par semaine : ${series.join(", ")}">
    <line x1="0" x2="${w}" y1="${h - .5}" y2="${h - .5}" stroke="var(--line)"/>
    ${series.map((v, i) => { const bh = v ? Math.max(3, v / max * (h - 6)) : 0;
      return `<rect x="${i * bw + 2}" y="${h - bh - 1}" width="${bw - 4}" height="${bh}" rx="2" fill="${color}" opacity="${i === n - 1 ? 1 : .55}"><title>${v} commit(s)</title></rect>`; }).join("")}
  </svg>`;
}
function stacked() {
  const w = 560, h = 150, pad = 22, n = MAXW, bw = (w - pad) / n;
  const tot = Array.from({ length: n }, (_, i) => D.projects.reduce((s, p) => s + p.series[i], 0));
  const max = Math.max(1, ...tot), sc = (h - 20) / max;
  let g = "";
  [0, .5, 1].forEach(f => { const y = h - 4 - f * (h - 20); g += `<line x1="${pad}" x2="${w}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pad - 4}" y="${y + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${Math.round(max * f)}</text>`; });
  for (let i = 0; i < n; i++) { let y = h - 4;
    D.projects.forEach(p => { const v = p.series[i] * sc; if (!v) return; y -= v;
      g += `<rect x="${pad + i * bw + 3}" y="${y}" width="${bw - 6}" height="${v}" rx="2" fill="${p.color}"><title>${p.name} : ${p.series[i]}</title></rect>`; });
    if (i % 2 === (n - 1) % 2) g += `<text x="${pad + i * bw + bw / 2}" y="${h + 10}" text-anchor="middle" font-size="9" fill="var(--muted)">${i === n - 1 ? "cette sem." : "S-" + (n - 1 - i)}</text>`;
  }
  return `<svg viewBox="0 0 ${w} ${h + 14}" style="width:100%;height:auto" role="img" aria-label="Commits par semaine, tous projets">${g}</svg>`;
}
function ci(r) {
  const s = r.ci?.status;
  if (!r.ci) return `<span class="ci-none" title="Pas de CI">○</span>`;
  return `<a class="ci-${s === "success" ? "success" : s === "failure" ? "failure" : "none"}" href="${esc(r.ci.url)}" title="CI : ${esc(s || "?")}">${s === "success" ? "●" : s === "failure" ? "✕" : "◐"}</a>`;
}
function card(p) {
  const repos = [...p.repos].sort((a, b) => (b.pushed || "").localeCompare(a.pushed || ""));
  const main = repos[0];
  const last = p.sessions[0];
  const sites = p.sites.map(u => `<a class="btn" href="${esc(u)}">🌐 ${esc(u.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a>`).join("");
  const extra = (p.links || []).map(l => `<a class="btn" href="${esc(l.url)}">${esc(l.label)}</a>`).join("");
  const feed = p.repos.flatMap(r => r.recent.map(c => ({ ...c, repo: r.name }))).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6);
  return `<article class="card" data-s="${p.status}" style="--c:${p.color}">
    <header><div><h2>${esc(p.emoji)} ${esc(p.name)}</h2><p>${esc(p.description)}</p></div>
      <span class="pill s-${p.status}">${STATUS[p.status] || p.status}</span></header>
    <div class="metrics">
      <div><b>${rel(p.pushed)}</b><span>Dernière activité</span></div>
      <div><b>${p.c7} / ${p.c30}</b><span>Commits 7 j / 30 j</span></div>
      <div><b>${p.prs} · ${p.issues}</b><span>PR · issues ouvertes</span></div>
      <div><b>${fdate(p.created)}</b><span>Créé le</span></div>
    </div>
    <div class="spark">${bars(p.series, p.color)}<small>${MAXW} dernières<br>semaines</small></div>
    ${p.next ? `<div class="next"><em>Prochaine étape :</em> ${esc(p.next)}</div>` : ""}
    <div class="links">
      ${last ? `<a class="btn main" href="${esc(last.url)}" title="${esc(last.title)}">💬 Reprendre la dernière conversation</a>` : ""}
      ${main ? `<a class="btn ${last ? "" : "main"}" href="${esc(main.url)}">Dépôt principal : ${esc(main.name)}</a>` : ""}
      ${sites}${extra}
    </div>
    <details ${p.repos.length <= 3 ? "open" : ""}><summary>Dépôts (${p.repos.length})</summary>
      <div class="tbl"><table><thead><tr><th>Dépôt</th><th>Activité</th><th>CI</th><th>PR · issues</th><th>Dernier commit</th></tr></thead><tbody>
      ${repos.map(r => `<tr><td><a href="${esc(r.url)}">${esc(r.name)}</a>${r.private ? '<span class="tag">privé</span>' : ""}${r.archived ? '<span class="tag">archivé</span>' : ""}${r.error ? `<div class="err">Erreur : ${esc(r.error)}</div>` : ""}</td>
        <td class="n">${rel(r.pushed)}</td><td>${ci(r)}</td><td class="n">${r.prs ?? 0} · ${r.issues ?? 0}</td><td class="m">${esc(r.recent[0]?.msg || "—")}</td></tr>`).join("")}
      </tbody></table></div></details>
    <details><summary>Conversations avec les agents (${p.sessions.length})</summary>
      ${p.sessions.length ? `<ul class="conv">${p.sessions.map(s => `<li><a href="${esc(s.url)}">${esc(s.title)}<small>${esc(s.repo)} · ${rel(s.date)}</small></a></li>`).join("")}</ul>`
        : `<p class="foot">Aucun lien détecté. Les sessions Claude Code sont repérées dans les messages de commit (ligne « Claude-Session »).</p>`}</details>
    <details><summary>Derniers commits</summary><ul class="feed" style="margin-top:8px;max-height:none">
      ${feed.map(c => `<li><span>${esc(c.msg)}</span><small>${esc(c.repo)} · ${esc(c.author)} · ${rel(c.date)}</small></li>`).join("")}</ul></details>
  </article>`;
}
function render(filter = "all") {
  const P = D.projects, repos = P.flatMap(p => p.repos);
  const feed = P.flatMap(p => p.repos.flatMap(r => r.recent.map(c => ({ ...c, repo: r.name, p })))).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 12);
  const counts = k => P.filter(p => p.status === k).length;
  $("#app").innerHTML = `
  <div class="top"><div><h1>Project Hub</h1><p>Tous vos projets, leur activité et vos conversations au même endroit.</p></div>
    <p class="foot">Mis à jour ${rel(D.generated)} · ${new Date(D.generated).toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" })}</p></div>
  <div class="tiles">
    <div class="tile"><b>${P.length}</b><span>Projets suivis</span></div>
    <div class="tile"><b>${repos.length}</b><span>Dépôts GitHub</span></div>
    <div class="tile"><b>${P.reduce((s, p) => s + p.c7, 0)}</b><span>Commits cette semaine</span></div>
    <div class="tile"><b>${counts("active")}</b><span>Projets actifs</span></div>
    <div class="tile"><b>${P.reduce((s, p) => s + p.prs, 0)}</b><span>Pull requests ouvertes</span></div>
  </div>
  <div class="row2">
    <section class="panel"><h2>Commits par semaine</h2>${stacked()}
      <div class="legend">${P.map(p => `<span><i style="background:${p.color}"></i>${esc(p.name)}</span>`).join("")}</div></section>
    <section class="panel"><h2>Activité récente</h2><ul class="feed">
      ${feed.map(c => `<li><i class="dot" style="background:${c.p.color}"></i><span>${esc(c.msg)}</span><small>${esc(c.repo)} · ${rel(c.date)}</small></li>`).join("")}</ul></section>
  </div>
  <div><div class="tabs" role="group" aria-label="Vue"><button data-v="tableau" aria-pressed="${VIEW === "tableau"}">📊 Tableau</button><button data-v="village" aria-pressed="${VIEW === "village"}">🏘️ Village</button></div></div>
  ${VIEW === "village" ? villageHTML() : `<div class="filters" role="group" aria-label="Filtrer par état">
    ${[["all", "Tous"], ["active", "Actifs"], ["recent", "Récents"], ["dormant", "Endormis"]].map(([k, l]) => `<button class="chip" data-f="${k}" aria-pressed="${k === filter}">${l}</button>`).join("")}</div>
  <div class="cards">${[...P].sort((a, b) => (b.pushed || "").localeCompare(a.pushed || "")).filter(p => filter === "all" || p.status === filter).map(card).join("") || '<p class="foot">Aucun projet dans cet état.</p>'}</div>`}
  <p class="foot">Données issues de l'API GitHub, rafraîchies automatiquement. Ajouter un projet : <code>node scripts/add.mjs owner/repo</code></p>`;
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => render(b.dataset.f));
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { VIEW = b.dataset.v; try { history.replaceState(null, "", "#" + VIEW); } catch {} render(); });
  if (VIEW === "village") startVillage();
}
/*__VILLAGE__*/
render();
</script>
