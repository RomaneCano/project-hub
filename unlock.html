<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Project Hub</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--fg:#16202c;--s:#fff;--l:#dde2e9;--a:#2f6df6}
@media(prefers-color-scheme:dark){:root{--bg:#0e141b;--fg:#e6edf5;--s:#16202b;--l:#273544;--a:#6b9bff}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
form{background:var(--s);border:1px solid var(--l);border-radius:12px;padding:28px;display:grid;gap:12px;width:min(340px,90vw)}
h1{margin:0;font-size:22px}input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--l);background:var(--bg);color:var(--fg)}
button{background:var(--a);color:#fff;border-color:var(--a);cursor:pointer;font-weight:600}#m{margin:0;min-height:1.2em;color:#dc2626;font-size:13px}
</style>
<form id="f"><h1>Project Hub</h1><label for="p">Mot de passe</label><input id="p" type="password" autocomplete="current-password" autofocus><button>Ouvrir</button><p id="m" role="alert"></p></form>
<script>
const S="__SALT__",V="__IV__",I=__ITER__,C="__CT__";
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById("f").onsubmit=async ev=>{
  ev.preventDefault(); const m=document.getElementById("m"); m.textContent="";
  try{
    const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("p").value),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(S),iterations:I,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(V)},key,b(C)));
    document.open();document.write(html);document.close();
  }catch{m.textContent="Mot de passe incorrect."}
};
</script>
